# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/store
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL Data Initialization
# Load data2.sql (minimal test data: 2 stores, 4 products)
# To use full data.sql instead, change data-locations to classpath:data.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.data-locations=classpath:data2.sql
spring.jpa.defer-datasource-initialization=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.inventory.orchestrator=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Application Configuration
app.name=Intelligent Inventory Orchestrator Backend
app.version=1.0.0

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/inventory-orchestrator}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/inventory-orchestrator/protocol/openid-connect/certs}

# Keycloak Admin Client Configuration (optional, for user management)
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:inventory-orchestrator}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:inventory-orchestrator-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.admin-realm=${KEYCLOAK_ADMIN_REALM:master}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
